upstream maycafe_api {
  server server-a:4000 max_fails=2 fail_timeout=3s;
  server server-b:4000 max_fails=2 fail_timeout=3s;
  keepalive 64;
}

upstream maycafe_socket {
  hash $remote_addr consistent;
  server server-a:4000 max_fails=2 fail_timeout=3s;
  server server-b:4000 max_fails=2 fail_timeout=3s;
}

# Guest portal — public QR/menu/order traffic only.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;

  location ~ ^/api/v1/(?:auth|staff|admin)(?:/|$) { return 404; }
  location ~ ^/(?:auth|staff|admin)(?:/|$) { return 404; }

  location = / { return 302 /t; }
  location / { try_files $uri $uri/ /index.html; }
}

# Staff portal — authentication and operational APIs only.
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;

  location ~ ^/api/v1/(?!auth(?:/|$)|staff(?:/|$)|health(?:/|$)) { return 404; }
  location ~ ^/(?:t|menu|cart|orders|receipt|ai|admin)(?:/|$) { return 404; }

  location = / { return 302 /staff; }
  location / { try_files $uri $uri/ /index.html; }
}

# Admin portal — authentication and back-office APIs only.
server {
  listen 8082;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;

  location ~ ^/api/v1/(?!auth(?:/|$)|admin(?:/|$)|health(?:/|$)) { return 404; }
  location ~ ^/(?:t|menu|cart|orders|receipt|ai|staff)(?:/|$) { return 404; }

  location = / { return 302 /admin; }
  location / { try_files $uri $uri/ /index.html; }
}
