# Nén JSON menu và bundle JS/CSS; html luôn được nén khi gzip bật.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

map $cookie_mc_guest $guest_limit_key {
  default $cookie_mc_guest;
  "" $binary_remote_addr;
}

limit_req_zone $guest_limit_key zone=guest_api_per_session:10m rate=15r/s;
limit_conn_zone $guest_limit_key zone=guest_connections_per_session:10m;
resolver 127.0.0.11 valid=5s ipv6=off;

upstream maycafe_guest_api {
  zone maycafe_guest_api_zone 64k;
  server server-guest-a:4000 resolve max_fails=2 fail_timeout=3s;
  server server-guest-b:4000 resolve max_fails=2 fail_timeout=3s;
  keepalive 64;
}

upstream maycafe_guest_socket {
  zone maycafe_guest_socket_zone 64k;
  hash $remote_addr consistent;
  server server-guest-a:4000 resolve max_fails=2 fail_timeout=3s;
  server server-guest-b:4000 resolve max_fails=2 fail_timeout=3s;
}

upstream maycafe_internal_api {
  zone maycafe_internal_api_zone 64k;
  server server-internal-a:4000 resolve max_fails=2 fail_timeout=3s;
  server server-internal-b:4000 resolve max_fails=2 fail_timeout=3s;
  keepalive 64;
}

upstream maycafe_internal_socket {
  zone maycafe_internal_socket_zone 64k;
  hash $remote_addr consistent;
  server server-internal-a:4000 resolve max_fails=2 fail_timeout=3s;
  server server-internal-b:4000 resolve max_fails=2 fail_timeout=3s;
}

# Guest portal — public QR/menu/order traffic only.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;
  include /etc/nginx/conf.d/maycafe-guest-proxy.inc;

  location ~ ^/api/v1/(?:auth|staff|admin)(?:/|$) { return 404; }
  location ~ ^/(?:auth|staff|admin)(?:/|$) { return 404; }

  location = / { return 302 /t; }
  location / {
    include /etc/nginx/conf.d/maycafe-security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}

# Staff portal — authentication and operational APIs only.
server {
  listen 8081;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;
  include /etc/nginx/conf.d/maycafe-internal-proxy.inc;

  location ~ ^/api/v1/(?!auth(?:/|$)|staff(?:/|$)|health(?:/|$)) { return 404; }
  location ~ ^/(?:t|menu|cart|orders|receipt|ai|admin)(?:/|$) { return 404; }

  location = / { return 302 /staff; }
  location / {
    include /etc/nginx/conf.d/maycafe-security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}

# Admin portal — authentication and back-office APIs only.
server {
  listen 8082;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/maycafe-common.inc;
  include /etc/nginx/conf.d/maycafe-internal-proxy.inc;

  location ~ ^/api/v1/(?!auth(?:/|$)|admin(?:/|$)|health(?:/|$)) { return 404; }
  location ~ ^/(?:t|menu|cart|orders|receipt|ai|staff)(?:/|$) { return 404; }

  location = / { return 302 /admin; }
  location / {
    include /etc/nginx/conf.d/maycafe-security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
