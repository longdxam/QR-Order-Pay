        '422': { description: Dữ liệu hoặc ngày giờ không hợp lệ }
    post:
      summary: Tạo hoặc replay lịch đặt bàn
      description: "Cookie HttpOnly mc_member, không cần QR; danh sách/chỉnh sửa chính chủ. Body strict {requestId UUID,tableId ObjectId,startsAt ISO offset,partySize 1..30,name 1..80,phone,note? 0..280}. Một lượt cố định 60 phút, giờ VN; bắt đầu từ 15 phút tới 7 ngày. Chống trùng khoảng và QR mở phiên bằng transaction/write lock Table. Thành viên tối đa 3 active, không hai bàn trùng giờ; counter không tự gán member theo SĐT. CONFIRMED; không mở phiên/đơn/thu tiền. Unique actor+request, hash payload; replay kiểm trước hạn thời gian. Trả {reservation,created}. Cache-Control no-store; mutation CSRF cho member. Socket reservation.changed chỉ staff, không chứa contact."
      responses:
        '200': { description: success/data envelope }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc CSRF bị từ chối }
        '404': { description: Không tồn tại hoặc không thuộc quyền truy cập }
        '409': { description: Trùng lịch hoặc version/key/trạng thái thay đổi }
        '422': { description: Dữ liệu hoặc ngày giờ không hợp lệ }
