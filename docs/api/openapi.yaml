      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200': { description: Đã xử lý; không trả quyền của người khác }
  /staff/payments:
    get:
      summary: STAFF hoặc ADMIN tra cứu khoản thu và yêu cầu điều chỉnh
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          {
            description: data.items (30/trang),
            total,
            corrections (200 yêu cầu,
            ưu tiên đang chờ),
            targets (200 đơn chờ),
          }
  /admin/payments:
    get:
      summary: ADMIN tra cứu khoản thu và hàng chờ duyệt
      responses:
        '200': { description: Cùng cấu trúc GET /staff/payments }
  /staff/payments/{id}/corrections:
    post:
      summary: STAFF hoặc ADMIN lập yêu cầu điều chỉnh một khoản thu
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [VOID, METHOD, TRANSFER] }
                reason: { type: string, minLength: 3, maxLength: 280 }
                method:
                  {
                    type: string,
                    enum: [CASH, BANK_TRANSFER, OTHER],
                    description: Bắt buộc cho METHOD,
                  }
                targetOrderId:
                  { type: string, description: ObjectId đơn nhận, bắt buộc cho TRANSFER }
      responses:
        '201': { description: Đã lập yêu cầu chờ quản lý khác duyệt }
        '409': { description: Khoản thu đã thay đổi, đang giữ quyền thu hoặc có yêu cầu khác }
  /admin/payments/{id}/corrections:
    post:
      summary: ADMIN lập yêu cầu như STAFF; quản lý khác phải duyệt
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '201': { description: 'Body và quy tắc như POST /staff/payments/{id}/corrections' }
  /admin/payment-corrections/{id}/decision:
    post:
      summary: ADMIN duyệt/từ chối yêu cầu điều chỉnh, có version guard
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, approve, note]
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                approve: { type: boolean }
                note: { type: string, minLength: 3, maxLength: 280 }
      responses:
        '200': { description: Đã xử lý và ghi audit; duyệt ghi đảo/thay thế trong transaction }
        '403': { description: Người lập không tự duyệt; chỉ ADMIN được quyết định }
        '409': { description: Yêu cầu đã xử lý hoặc trạng thái khoản thu/đơn đã thay đổi }
  /staff/orders/{id}/refund:
    post:
      summary: Ghi nhận đã hoàn đủ tiền thủ công và hủy đơn chưa pha chế
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, method, expectedVersion, reason, refundConfirmed]
              properties:
                amount: { type: integer, minimum: 0 }
                method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 3, maxLength: 280 }
                refundConfirmed: { type: boolean, enum: [true] }
      responses:
        '200': { description: Đơn CANCELLED và REFUNDED; ca ghi nhận tiền hoàn }
        '409': { description: Đơn đã thay đổi hoặc không thể hoàn }
  /admin/anomalies:
    get:
      summary: Trạng thái detector và cảnh báo vận hành cho ADMIN
      description: Trả bốn evaluation gần nhất, tối đa 50 alert, lịch job và thời điểm chạy. GET không kích hoạt detector hoặc LLM.
      responses:
        '200': { description: Detector state, evidence, explanation và vòng đời alert }
        '401': { description: Chưa đăng nhập }
        '403': { description: Chỉ ADMIN }
  /admin/anomalies/{id}/status:
