          application/json:
            schema:
              type: object
              properties:
                reassignTo:
                  type: string
                  description: ID danh mục nhận; bắt buộc nếu còn món, gồm món đã xóa mềm
      responses:
        '200':
          { description: Đã chuyển món và xóa danh mục; data.category.movedProductCount ghi số món }
        '403': { description: Chỉ ADMIN }
        '404': { description: Danh mục nguồn hoặc nhận không tồn tại }
        '409': { description: CATEGORY_NOT_EMPTY khi còn món mà chưa chọn danh mục nhận }
        '422': { description: ID không hợp lệ hoặc danh mục nhận trùng nguồn }
  /admin/toppings:
    get: { summary: Topping, responses: { '200': { description: OK } } }
    post: { summary: Tạo topping, responses: { '201': { description: OK } } }
  /admin/toppings/{id}:
    patch: { summary: Cập nhật topping, responses: { '200': { description: OK } } }
    delete:
      summary: Xóa mềm topping (ADMIN); khôi phục bằng PATCH isArchived=false
      responses:
        '200': { description: 'Ẩn topping khỏi menu và chặn giỏ cũ, giữ nguyên đơn cũ' }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không tìm thấy topping }
  /admin/tables:
    get: { summary: Danh sách bàn, responses: { '200': { description: OK } } }
  /admin/users:
    get:
      {
        summary: Danh sách tài khoản (ADMIN),
        responses: { '200': { description: Không trả passwordHash } },
      }
    post:
      summary: Tạo tài khoản STAFF hoặc ADMIN
      responses:
        '201':
          { description: 'Tài khoản mới; name, email, password 8–72 ký tự, role STAFF hoặc ADMIN' }
        '409': { description: Email đã được sử dụng }
  /admin/users/{id}:
    patch:
      summary: Sửa tài khoản hoặc đặt lại mật khẩu (ADMIN)
      description: Chỉ nhận name, email, role, isActive, password. Không tự khóa hoặc hạ quyền. Đổi quyền/trạng thái/mật khẩu thu hồi access và refresh cũ; socket bị ngắt trong tối đa 10 giây.
      responses:
        '200': { description: 'Tài khoản sau cập nhật, không trả passwordHash' }
        '403': { description: Chỉ ADMIN }
        '409': { description: Email trùng hoặc tự khóa/hạ quyền }
        '422': { description: Dữ liệu không hợp lệ }
    delete:
      summary: Xóa nhân viên (ADMIN)
      description: Chỉ xóa STAFF. Gỡ khỏi danh sách và ngừng đăng nhập; giữ bản ghi phục vụ lịch sử ca làm/khoản thu. Thu hồi access/refresh cũ; không thể mở khóa lại bằng PATCH.
      responses:
        '200': { description: Đã xóa nhân viên }
        '403': { description: Chỉ ADMIN }
        '404': { description: Không tìm thấy nhân viên hoặc đã xóa }
        '409': { description: Không thể xóa quản trị viên }
        '422': { description: ID không hợp lệ }
  /auth/me:
    get:
      summary: Tài khoản hiện tại
      responses:
        '200': { description: 'id, name, email, role, isActive, createdAt' }
    patch:
      summary: Sửa họ tên của tài khoản hiện tại
      responses:
        '200': { description: data.user chứa thông tin đã cập nhật }
        '422': { description: 'Tên trống, quá 80 ký tự hoặc trường ngoài name' }
  /auth/password:
    post:
      summary: Đổi mật khẩu bằng currentPassword và newPassword
      description: Mật khẩu mới 8–72 ký tự, khác mật khẩu hiện tại. Thu hồi mọi phiên đăng nhập và xóa cookie; cần đăng nhập lại.
      responses:
        '200': { description: Đã đổi mật khẩu }
        '401': { description: Chưa đăng nhập }
        '422': { description: Mật khẩu hiện tại sai hoặc mật khẩu mới không hợp lệ }
  /orders/quote:
    post:
      summary: Báo giá ký số ràng buộc guest/phiên/fingerprint giỏ và thành viên/ưu đãi
      description: Body items và voucherCode và/hoặc redeemPoints. Response thêm subtotal, voucherCode, voucherDiscount, pointsDiscount, redeemedPoints, voucherAllowsPoints, maxRedeemPoints. Kiểm lại quyền kết hợp/quota/điểm khi đặt trong transaction. Báo giá dùng hạn mức riêng theo phiên bàn, mặc định60/phút (RATE_LIMIT_GUEST_QUOTE_MAX), không tiêu hao hạn mức tạo đơn12/phút. 429 trả JSON RATE_LIMITED và header Retry-After.
      responses:
        '200': { description: Dòng món chuẩn hóa, tổng và thời hạn }
        '409': { description: Món/voucher không khả dụng hoặc không đủ điểm }
        '422': { description: Tùy chọn hoặc điều kiện ưu đãi sai }
        '429': { description: Vượt hạn mức báo giá; chờ theo Retry-After rồi thử lại }
