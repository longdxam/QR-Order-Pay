openapi: 3.0.3
components:
  schemas:
    LatteArtExportInput:
      type: object
      additionalProperties: false
      required: [requestId, orderId, itemIndex]
      properties:
        requestId: { type: string, format: uuid }
        orderId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        itemIndex: { type: integer, minimum: 0, maximum: 9999 }
    CupPhotoMetadata:
      type: object
      properties:
        kind: { type: string, enum: [PHOTO, LATTE_ART] }
        latteStyle: { type: string, enum: [SOFT, BOLD, DOTS] }
        id: { type: string }
        width: { type: integer }
        height: { type: integer }
        expiresAt: { type: string, format: date-time }
    CupPrintInput:
      type: object
      additionalProperties: false
      required: [requestId, orderId, itemIndex, copies, paper]
      properties:
        requestId: { type: string, format: uuid }
        orderId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        itemIndex: { type: integer, minimum: 0, maximum: 9999 }
        copies: { type: integer, minimum: 1, maximum: 50 }
        paper: { type: string, enum: [A4, LABEL_60_80] }
    JukeboxDeviceInput:
      type: object
      additionalProperties: false
      required: [deviceId]
      properties:
        deviceId: { type: string, format: uuid }
    JukeboxControlInput:
      type: object
      additionalProperties: false
      required: [deviceId, requestId, playbackVersion]
      properties:
        deviceId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        playbackVersion: { type: integer, minimum: 0 }
    JukeboxPlayInput:
      type: object
      additionalProperties: false
      required: [deviceId, requestId, playbackVersion, trackId]
      properties:
        deviceId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        playbackVersion: { type: integer, minimum: 0 }
        trackId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
    JukeboxVoteInput:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion, trackId]
      properties:
        requestId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        trackId: { type: string, nullable: true, pattern: '^[a-fA-F0-9]{24}$' }
    JukeboxTrackInput:
      type: object
      additionalProperties: false
      required: [requestId, expectedVersion, title, artist, audioUrl, enabled]
      properties:
        requestId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 100 }
        artist: { type: string, minLength: 1, maxLength: 100 }
        audioUrl: { type: string, format: uri, maxLength: 2048, description: Link video YouTube watch/youtu.be/shorts/live/embed hoặc HTTPS trực tiếp mp3/ogg/wav/m4a/aac/opus; không credentials; có thể query }
        enabled: { type: boolean }
info:
  title: Fantastic cafe API
  version: 1.0.0
  description: |
    REST API cho hệ thống đặt đồ uống qua QR tích hợp AI Barista.
    - Prefix: `/api/v1`
    - Auth: JWT (Staff/Admin) + HttpOnly cookie (Guest)
    - Error envelope: `{ success: false, error: { code, message, details? }, requestId }`
    - Socket nội bộ `workforce.changed`: `{refresh:true}` qua outbox sau commit tạo/sửa/hủy/chấm/điều chỉnh/cấu hình/copy; chỉ Staff/Admin, không chứa thông tin nhân sự. Client đọc lại snapshot theo quyền, refetch khi reconnect và polling 30 giây dự phòng.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /cup-photos/{id}/details:
    get:
      summary: Metadata ảnh riêng của chính chủ, gồm loại ảnh và kiểu latte art
      description: No-store; quyền QR/member/counter và portal giống endpoint upload. Không trả owner/hash/bytes hoặc sourcePhotoId.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Envelope CupPhotoMetadata }
        '401': { description: Chưa xác thực }
        '404': { description: Ảnh hết hạn hoặc không thuộc chủ thể }
  /cup-photos/{id}/latte-art:
    post:
      summary: Tạo đúng ba kiểu latte art từ ảnh gốc chính chủ
      description: 'Strict body rỗng, no-store; CSRF/limiter/owner/portal như upload, QR cần OPEN. Resource-idempotent theo source/version/style, transaction owner-lock + audit. Giữ pixel/bố cục, không AI hoặc provider ngoài. Ba biến thể 1024x1024, nguồn gốc/đầu ra chưa gắn hạn24h, bản chọn gắn đơn gia hạn30ngày. Không tạo Order/Payment hoặc tự chọn bản.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: 'Envelope sourceId và variants đúng3 CupPhotoMetadata có kind LATTE_ART/latteStyle SOFT BOLD DOTS' }
        '403': { description: Phiên không OPEN hoặc CSRF }
        '404': { description: Không phải ảnh gốc chính chủ còn hạn }
        '422': { description: Body không hợp lệ hoặc nguồn đã là latte art }
        '429': { description: Giới hạn tác vụ hoặc limiter }
  /staff/cup-photos/{id}/details:
    get:
      summary: Metadata ảnh riêng của chính chủ, gồm loại ảnh và kiểu latte art
      description: No-store; quyền QR/member/counter và portal giống endpoint upload. Không trả owner/hash/bytes hoặc sourcePhotoId.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Envelope CupPhotoMetadata }
        '401': { description: Chưa xác thực }
        '404': { description: Ảnh hết hạn hoặc không thuộc chủ thể }
  /staff/cup-photos/{id}/latte-art:
    post:
      summary: Tạo đúng ba kiểu latte art từ ảnh gốc chính chủ
      description: 'Strict body rỗng, no-store; CSRF/limiter/owner/portal như upload, QR cần OPEN. Resource-idempotent theo source/version/style, transaction owner-lock + audit. Giữ pixel/bố cục, không AI hoặc provider ngoài. Ba biến thể 1024x1024, nguồn gốc/đầu ra chưa gắn hạn24h, bản chọn gắn đơn gia hạn30ngày. Không tạo Order/Payment hoặc tự chọn bản.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: 'Envelope sourceId và variants đúng3 CupPhotoMetadata có kind LATTE_ART/latteStyle SOFT BOLD DOTS' }
        '403': { description: Phiên không OPEN hoặc CSRF }
        '404': { description: Không phải ảnh gốc chính chủ còn hạn }
        '422': { description: Body không hợp lệ hoặc nguồn đã là latte art }
        '429': { description: Giới hạn tác vụ hoặc limiter }
  /admin/cup-photos/{id}/details:
    get:
      summary: Metadata ảnh riêng của chính chủ, gồm loại ảnh và kiểu latte art
      description: No-store; quyền QR/member/counter và portal giống endpoint upload. Không trả owner/hash/bytes hoặc sourcePhotoId.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Envelope CupPhotoMetadata }
        '401': { description: Chưa xác thực }
        '404': { description: Ảnh hết hạn hoặc không thuộc chủ thể }
  /admin/cup-photos/{id}/latte-art:
    post:
      summary: Tạo đúng ba kiểu latte art từ ảnh gốc chính chủ
      description: 'Strict body rỗng, no-store; CSRF/limiter/owner/portal như upload, QR cần OPEN. Resource-idempotent theo source/version/style, transaction owner-lock + audit. Giữ pixel/bố cục, không AI hoặc provider ngoài. Ba biến thể 1024x1024, nguồn gốc/đầu ra chưa gắn hạn24h, bản chọn gắn đơn gia hạn30ngày. Không tạo Order/Payment hoặc tự chọn bản.'
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: 'Envelope sourceId và variants đúng3 CupPhotoMetadata có kind LATTE_ART/latteStyle SOFT BOLD DOTS' }
        '403': { description: Phiên không OPEN hoặc CSRF }
        '404': { description: Không phải ảnh gốc chính chủ còn hạn }
        '422': { description: Body không hợp lệ hoặc nguồn đã là latte art }
        '429': { description: Giới hạn tác vụ hoặc limiter }
  /staff/cup-prints/latte-art/exports:
    post:
      summary: Xuất PNG latte art đã chọn trong đơn PAID
      description: 'JWT/role nội bộ, no-store. UUID/hash replay, paid/order-version/ảnh còn hạn/kind LATTE_ART. Ghi EXPORT_READY/CupPrintAttempt paper LATTE_PNG và audit yêu cầu xuất file; không gửi lệnh phần cứng, không ghi đã in, không đổi tiền/trạng thái phục vụ. File RGB trắng1024x1024 đúng pixel thiết kế, không chữ hoặc foam mockup.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatteArtExportInput' }
      responses:
        '200':
          description: File PNG attachment cho phần mềm máy in đồ uống
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không đủ quyền }
        '404': { description: Đơn chưa trả/hủy/hoàn hoặc ảnh hết hạn }
        '409': { description: Key trùng khác payload }
        '422': { description: Sai dòng hoặc ảnh thuộc loại in tem }
  /admin/cup-prints/latte-art/exports:
    post:
      summary: Xuất PNG latte art đã chọn trong đơn PAID
      description: 'JWT/role nội bộ, no-store. UUID/hash replay, paid/order-version/ảnh còn hạn/kind LATTE_ART. Ghi EXPORT_READY/CupPrintAttempt paper LATTE_PNG và audit yêu cầu xuất file; không gửi lệnh phần cứng, không ghi đã in, không đổi tiền/trạng thái phục vụ. File RGB trắng1024x1024 đúng pixel thiết kế, không chữ hoặc foam mockup.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LatteArtExportInput' }
      responses:
        '200':
          description: File PNG attachment cho phần mềm máy in đồ uống
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không đủ quyền }
        '404': { description: Đơn chưa trả/hủy/hoàn hoặc ảnh hết hạn }
        '409': { description: Key trùng khác payload }
        '422': { description: Sai dòng hoặc ảnh thuộc loại in tem }
  /staff/tables/{id}/qr:
    get:
      summary: Xem QR tĩnh của bàn (STAFF hoặc ADMIN)
      description: JWT/no-store. Chỉ đọc, không xoay khóa hoặc mở phiên. Token qrs1 giữ nguyên qua đóng/chuyển phiên, kiểm chữ ký và staticQrEpoch.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: 'Envelope data {tableId,tableName,url}' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không đủ quyền }
        '404': { description: Bàn không còn hoạt động }
  /admin/tables/{id}/qr:
    get:
      summary: Xem QR tĩnh của bàn (ADMIN)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
      responses:
        '200': { description: 'Envelope data {tableId,tableName,url}, no-store, read-only' }
        '401': { description: Chưa đăng nhập }
        '403': { description: Không đủ quyền }
        '404': { description: Bàn không còn hoạt động }
  /cup-photos:
    post: &cupPhotoUpload
      summary: Tải ảnh riêng để in tem dán cốc
      description: "Guest QR OPEN đúng participant (/cup-photos); JWT STAFF/ADMIN (/staff/cup-photos) hoặc ADMIN (/admin/cup-photos). Guest CSRF. Raw JPEG/PNG/WebP tĩnh4MB, min64px/chiều,max16MP; magic+decode thật, chặn ảnh động/SVG/giả. Normalize JPEG1024px/quality85/không metadata, max1MB. UUID/hash replay, quota20ảnh/24giờ/chủ,5upload/phút/table hoặcIP,2decode/API; 429 khi bận. Lưu MongoDB riêng24h, gắn đơn/quà kéo dài30ngày, TTL. Không tạo đơn/thu tiền."
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200': { description: 'Envelope data CupPhotoMetadata, không bytes/tên file/URL public' }
        '401': { description: Cần phiên/tài khoản đúng loại }
        '403': { description: Role/CSRF/không OPEN }
        '409': { description: Key đổi nội dung/quota/hạn }
        '413': { description: Quá4MB }
        '415': { description: MIME không hỗ trợ }
        '422': { description: Ảnh/dimensions/request ID sai }
        '429': { description: Giới hạn tốc độ hoặc xử lý bận }
  /staff/cup-photos:
    post: *cupPhotoUpload
  /admin/cup-photos:
    post: *cupPhotoUpload
  /cup-photos/{id}:
    get: &ownCupPhoto
      summary: Đọc ảnh riêng của đúng chủ upload
      description: "Quyền tương ứng prefix như upload; cookie/JWT, không token trong URL. Không truy cập ảnh của participant/member/counter khác. JPEG chuẩn hóa, no-store/nosniff. Ảnh hết hạn trả404 dù TTL chưa dọn. GuestOrder chỉ hasCupPhoto, không private ID; Gift sender có ID để tạo đơn, receiver chỉ cờ."
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }]
      responses:
        '200': { description: JPEG riêng tư, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { description: Cần xác thực }
        '403': { description: Sai role }
        '404': { description: Không thuộc chủ/đã hết hạn/không có }
        '422': { description: ID sai }
  /staff/cup-photos/{id}:
    get: *ownCupPhoto
  /admin/cup-photos/{id}:
    get: *ownCupPhoto
  /staff/cup-prints:
    get: &cupPrintFeed
      summary: Danh sách đơn đã thanh toán có ảnh in tem
      description: "JWT STAFF/ADMIN (admin prefix chỉ ADMIN), no-store. Chỉ PAID và PENDING/CONFIRMED/PREPARING/READY/SERVED, không hủy/hoàn. 20đơn/trang, createdAt/id giảm dần, rows có available theo ảnh còn hạn và attempts số yêu cầu in. Không bytes/asset ID/SĐT/danh tính người gửi."
      parameters: [{ in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }]
      responses:
        '200': { description: 'Envelope data {items:[id,code,destination,status,createdAt,items:[index,name,size,quantity,available,attempts]],page,total,pages}' }
        '401': { description: Cần JWT }
        '403': { description: Sai role }
        '422': { description: Page sai }
    post: &cupPrintRequest
      summary: Ghi nhận yêu cầu in, không xác nhận máy in thực
      description: "JWT đúng role. Kiểm PAID/order còn hiệu lực/ảnh còn hạn/copies<=quantity. Transaction order guard/audit/journal unique user/request. Replay cùng nội dung một journal, đổi nội dung409, reprint chủ động key mới. current image không đổi sau đặt; ảnh quote/Order input cupPhotoId optional và kiểm chủ/hạn, quote hash bảo vệ thay ảnh. Không thay tổng tiền/Payment/Bill/trạng thái phục vụ; versionOrder có thể tăng. UI mở hộp thoại, trạng thái REQUESTED không phải đã in/đã dán; nativeCtrl+P ngoài nhật ký."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CupPrintInput' } } } }
      responses:
        '200': { description: 'Envelope data {id,state:REQUESTED}' }
        '401': { description: Cần JWT }
        '403': { description: Sai role }
        '404': { description: Đơn/ảnh không đủ điều kiện, gồm replay sau hủy }
        '409': { description: Key đổi nội dung }
        '422': { description: Input/số tem không hợp lệ }
  /admin/cup-prints:
    get: *cupPrintFeed
    post: *cupPrintRequest
  /staff/cup-prints/{id}/{index}/image:
    get: &cupPrintImage
      summary: Staff/Admin lấy ảnh đúng dòng đơn đã thu tiền để xem/in
      description: JWT đúng role, no-store/nosniff, JPEG private; không qua đường ảnh gốc/public ID. Kiểm điều kiện đơn/ảnh như print. Client dùng Blob URL và thu hồi khi đóng/rời.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
        - { in: path, name: index, required: true, schema: { type: integer, minimum: 0, maximum: 9999 } }
      responses:
        '200': { description: JPEG riêng tư, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '401': { description: Cần JWT }
        '403': { description: Sai role }
        '404': { description: Đơn/ảnh/dòng không đủ điều kiện }
        '422': { description: ID/index sai }
  /admin/cup-prints/{id}/{index}/image:
    get: *cupPrintImage
  /jukebox:
    get:
      summary: Nhạc và lựa chọn chung của phiên bàn QR
      description: "Cookie mc_guest, no-store. Guest không có URL/audio, danh tính hay ID phiên/bàn/device. Vote một lựa chọn chung/phiên, 5 lượt tiêu thụ khi chọn phát; chỉ OPEN góp hàng đợi. Queue giảm theo số bàn vote, hòa theo lượt chọn sớm còn hiệu lực rồi ID. current là bài được quầy chọn, không cam kết loa đang phát. jukebox.changed chỉ refresh qua outbox, polling 5 giây/reconnect."
      responses:
        '200': { description: 'Envelope data JukeboxFeed: tracks/queue(votes)/current/playbackVersion/serverNow/vote(trackId,version,remaining,canVote)' }
        '401': { description: Cần capability QR }
        '403': { description: Phiên kết thúc }
  /jukebox/vote:
    post:
      summary: Chọn/đổi/hủy bài chung cho phiên bàn
      description: "Cookie QR + CSRF, 20 mutation/phút/phiên, no-store. Strict body, chỉ OPEN; trackId null để hủy. Đổi/hủy không trừ lượt; cùng bài giữ thời điểm. UUID/hash/journal transaction, retry cùng payload không thêm vote/trừ lượt. Version chung của ballot, không theo participant. Chặn bài hiện tại/tắt/hết 5 lượt; không đổi Order/Payment/Bill."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxVoteInput' } } } }
      responses:
        '200': { description: JukeboxFeed mới nhất hoặc replay }
        '401': { description: Cần QR }
        '403': { description: Không OPEN hoặc CSRF }
        '404': { description: Bài không mở }
        '409': { description: Version/key conflict hoặc hết lượt/bài hiện tại }
        '422': { description: Input không hợp lệ }
  /staff/jukebox:
    get: &jukeboxStaffFeed
      summary: Hàng đợi và quyền thiết bị phát tại quầy
      description: "JWT active STAFF/ADMIN (admin prefix chỉ ADMIN), no-store. Query deviceId UUID, không trả ID chủ lease. current.audioUrl chỉ có giá trị khi đúng user/device giữ lease còn hạn; lease {owned,busy,until}, vote null. PlaybackVersion riêng không tăng theo vote."
      parameters: [{ in: query, name: deviceId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: 'Envelope data JukeboxStaffFeed = feed + current.audioUrl + lease' }
        '401': { description: Cần đăng nhập nội bộ }
        '403': { description: Không đúng role }
        '422': { description: deviceId không hợp lệ }
  /admin/jukebox:
    get: *jukeboxStaffFeed
  /staff/jukebox/claim:
    post: &jukeboxClaim
      summary: Lấy quyền thiết bị phát 30 giây
      description: JWT STAFF/ADMIN (admin prefix chỉ ADMIN). Không giành lease còn hạn của user/device khác. Mỗi mount một UUID riêng; heartbeat mỗi 10 giây. Lease không phải bằng chứng loa phát hoặc DRM.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxDeviceInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed }
        '401': { description: Cần đăng nhập }
        '403': { description: Sai role }
        '409': { description: Thiết bị khác đang giữ quyền }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/claim:
    post: *jukeboxClaim
  /staff/jukebox/heartbeat:
    post: &jukeboxHeartbeat
      summary: Gia hạn đúng lease user/device đang còn hạn
      description: JWT STAFF/ADMIN (admin prefix chỉ ADMIN). Không tự nhận lại lease hết hạn. Client dừng audio khi lỗi/mất lease, ẩn/rời trang và nhả best effort.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxDeviceInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed với hạn mới }
        '401': { description: Cần đăng nhập }
        '403': { description: Sai role }
        '409': { description: Không còn đúng lease }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/heartbeat:
    post: *jukeboxHeartbeat
  /staff/jukebox/release:
    post: &jukeboxRelease
      summary: Nhả lease của đúng user/device
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxDeviceInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed không giữ lease }
        '401': { description: Cần JWT STAFF/ADMIN (admin prefix chỉ ADMIN) }
        '403': { description: Sai role }
        '409': { description: Không còn đúng lease }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/release:
    post: *jukeboxRelease
  /staff/jukebox/next:
    post: &jukeboxNext
      summary: Chọn đầu hàng đợi hoặc dừng nếu không có vote
      description: "JWT STAFF/ADMIN (admin prefix chỉ ADMIN), đúng lease. PlaybackVersion chống next/ended cũ; UUID/hash journal idempotent cùng transaction. Chốt snapshot tên/nghệ sĩ/URL; tiêu thụ một lượt ở từng phiên OPEN vote bài đó và xóa lựa chọn đã dùng. Queue còn lại giữ nguyên; không fallback bài không vote."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxControlInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed hoặc replay }
        '401': { description: Cần đăng nhập }
        '403': { description: Sai role }
        '409': { description: Lease/version/key conflict }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/next:
    post: *jukeboxNext
  /staff/jukebox/play:
    post: &jukeboxPlay
      summary: Nhân viên chọn trực tiếp một bài đang mở, không cần vote
      description: Đúng JWT role và lease user/device. UUID/hash/playbackVersion chống phát trùng hoặc lệnh cũ; chốt snapshot nguồn từ catalog. Nếu bài có vote hợp lệ, tiêu thụ lượt của các phiên OPEN vote bài đó như next, giữ các bài khác trong hàng đợi. Không nhận URL tùy ý từ body, không sửa danh sách nhạc.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxPlayInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed hoặc replay }
        '401': { description: Cần đăng nhập }
        '403': { description: Sai role }
        '404': { description: Bài không tồn tại hoặc đã tắt }
        '409': { description: Lease/version/key conflict }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/play:
    post: *jukeboxPlay
  /staff/jukebox/stop:
    post: &jukeboxStop
      summary: Bỏ bài đang chọn phát và giữ hàng đợi
      description: JWT đúng role/lease, strict control body. Tăng playbackVersion, current null, không trừ thêm lượt; retry journal như next. Không đồng nghĩa pause cục bộ.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxControlInput' } } } }
      responses:
        '200': { description: JukeboxStaffFeed hoặc replay }
        '401': { description: Cần đăng nhập }
        '403': { description: Sai role }
        '409': { description: Lease/version/key conflict }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/stop:
    post: *jukeboxStop
  /admin/jukebox/tracks:
    get:
      summary: Catalog nhạc đầy đủ gồm nguồn audio (chỉ ADMIN)
      responses:
        '200': { description: 'Envelope data array id/title/artist/audioUrl/enabled/version, tối đa 100 bài' }
        '401': { description: Cần JWT }
        '403': { description: Cần ADMIN }
    post:
      summary: Thêm bài audio HTTPS (chỉ ADMIN)
      description: "Strict body, expectedVersion=0. Tối đa100 bài, không upload/proxy/server fetch hay hỗ trợ link trang YouTube/Spotify. URL cú pháp không chứng minh codec/nguồn phát được. Replay trả cùng id, không tạo trùng."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxTrackInput' } } } }
      responses:
        '200': { description: 'Envelope data {id}' }
        '401': { description: Cần JWT }
        '403': { description: Cần ADMIN }
        '409': { description: Version/key hoặc giới hạn100 }
        '422': { description: Input không hợp lệ }
  /admin/jukebox/tracks/{id}:
    put:
      summary: Sửa/tắt/mở bài theo version (chỉ ADMIN)
      description: Tắt bài bỏ vote chưa phát không trừ lượt. Snapshot lượt đang phát giữ nguyên. UUID/hash replay trả id, không sửa hai lần.
      parameters: [{ in: path, name: id, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JukeboxTrackInput' } } } }
      responses:
        '200': { description: 'Envelope data {id}' }
        '401': { description: Cần JWT }
        '403': { description: Cần ADMIN }
        '404': { description: Không tìm thấy bài }
        '409': { description: Version/key conflict }
        '422': { description: Input không hợp lệ }
  /gifts/tables:
    get:
      summary: Danh sách thẻ bàn có thể nhận quà
      description: "Cookie mc_guest, phiên gửi OPEN; no-store. Trả {items:[{tableId,sessionId,name,code,available}]}. Không trả QR/token/participant/contact. Không có phiên OPEN và guest capability hợp lệ thì available=false; bỏ chính bàn gửi."
      responses:
        '200': { description: success/data envelope }
        '401': { description: Cần quét QR tại bàn }
        '403': { description: Phiên không còn OPEN }
  /gifts:
    get:
      summary: Lịch sử quà gửi chính chủ và quà nhận của phiên bàn
      description: "Cookie mc_guest, no-store. Trả {items,total,page,incomingCount}, 30 dòng/trang; quà gửi chỉ participant chính chủ, quà nhận thuộc cả phiên. GiftView gồm id,direction,status,recipientTableName,message,items,expiresAt,createdAt,version,orderStatus,showSenderTable; chỉ người gửi có orderId. Khi showSenderTable=true mới có senderTable:{name,code} là snapshot bàn gửi thực tế; mặc định false và quà legacy không có senderTable. Không lộ tài khoản/participant/session, requestId/hash, giá/ưu đãi hoặc mã đơn cho người nhận. Quét hết hạn khi đọc; polling 10 giây và gift.changed qua outbox chỉ {refresh:true}, room người gửi/phiên nhận, không Staff/bàn khác."
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
      responses:
        '200': { description: success/data envelope }
        '401': { description: Cần quét QR tại bàn }
    post:
      summary: Gửi lời mời tặng quà với lựa chọn ẩn hoặc hiện bàn gửi
      description: "Cookie mc_guest, CSRF/rate/no-store. Strict {requestId UUID,recipientTableId,recipientSessionId,message tối đa 140,items 1..10 dòng,quantity 1..10,showSenderTable boolean mặc định false}. Chỉ server xác định tên/mã bàn gửi, snapshot khi true; không nhận senderTable tự khai. Chế độ cố định sau khi gửi, đổi chế độ cùng requestId bị conflict; pending legacy ẩn danh vẫn replay được. Items có productId,variantId nullable,sugarLevel,iceLevel,toppingIds,note. Hai phiên khác nhau phải OPEN, bàn nhận active/có guest hợp lệ. PENDING 5 phút; replay cùng owner/requestId và payload an toàn. Trần 3 active/người gửi, 5 active/phiên nhận, 5 lần gửi/10 phút/người gửi. Chưa Order/Payment/giữ kho/ưu đãi."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, recipientTableId, recipientSessionId, items]
              additionalProperties: false
              properties:
                requestId: { type: string, format: uuid }
                recipientTableId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                recipientSessionId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                message: { type: string, maxLength: 140 }
                showSenderTable: { type: boolean, default: false }
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [productId, variantId, sugarLevel, iceLevel, toppingIds, quantity]
                    additionalProperties: false
                    properties:
                      productId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                      variantId: { type: string, nullable: true, pattern: '^[a-fA-F0-9]{24}$' }
                      sugarLevel: { type: string, maxLength: 40 }
                      iceLevel: { type: string, maxLength: 40 }
                      toppingIds: { type: array, maxItems: 20, items: { type: string, pattern: '^[a-fA-F0-9]{24}$' } }
                      note: { type: string, maxLength: 280 }
                      quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200': { description: GiftView của người gửi hoặc replay }
        '401': { description: Cần quét QR tại bàn }
        '403': { description: Không đủ quyền hoặc CSRF bị từ chối }
        '409': { description: Bàn thay đổi hoặc đạt trần hoặc requestId dùng với payload khác }
        '422': { description: Dữ liệu món hoặc cấu hình không hợp lệ }
  /gifts/{id}/decision:
    post:
      summary: Nhận hoặc từ chối quà của phiên nhận; người gửi hủy lời mời
      description: "Cookie mc_guest, CSRF/rate/no-store. Bàn nhận quyết định PENDING; ACCEPTED thêm 5 phút để người gửi đặt; DECLINED kết thúc. Chỉ participant gửi được CANCEL PENDING/ACCEPTED. Quyết định đầu tiên thắng, replay cùng actor/version/quyết định không thêm event. Quá hạn hoặc một phiên không OPEN chuyển EXPIRED. ORDERED không hủy qua endpoint này; dùng hủy/hoàn đơn hiện có. Người gửi lấy /orders/quote rồi POST /orders với giftId, items đúng đã nhận, quoteToken và Idempotency-Key; transaction kiểm hạn/ownership, giữ kho/ưu đãi và tạo đúng một payer order. Bàn nhận không nợ, không được xem/hủy/đánh giá đơn người gửi. KDS có gift đích giao riêng, Bill chỉ thuộc người gửi."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, decision]
              additionalProperties: false
              properties:
                expectedVersion: { type: integer, minimum: 0 }
                decision: { type: string, enum: [ACCEPT, DECLINE, CANCEL] }
      responses:
        '200': { description: GiftView theo quyền actor }
        '401': { description: Cần quét QR tại bàn }
        '403': { description: Không đúng người gửi hoặc phiên nhận }
        '404': { description: Quà không tồn tại }
        '409': { description: Hết hạn hoặc version/trạng thái thay đổi }
        '422': { description: Body hoặc ID không hợp lệ }
  /reservations/availability:
    get:
      summary: Tìm bàn trống đủ chỗ trong khoảng 60 phút
      description: "Cookie HttpOnly mc_member, không cần QR; danh sách/chỉnh sửa chính chủ. Query startsAt ISO có offset, partySize 1..30. Bắt đầu từ 15 phút tới 7 ngày. Trả tables [{id,name,code,capacity}], startsAt,endsAt,durationMinutes=60,graceMinutes=15. Không QR token/contact. Loại phiên đang phục vụ cho lịch bắt đầu trong 60 phút tới; lịch xa hơn cần xử lý quá giờ tại check-in. Cache-Control no-store; mutation CSRF cho member. Socket reservation.changed chỉ staff, không chứa contact."
      parameters:
        - in: query
          name: startsAt
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: partySize
          required: true
          schema: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '200': { description: success/data envelope }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc CSRF bị từ chối }
        '404': { description: Không tồn tại hoặc không thuộc quyền truy cập }
        '409': { description: Trùng lịch hoặc version/key/trạng thái thay đổi }
        '422': { description: Dữ liệu hoặc ngày giờ không hợp lệ }
  /reservations:
    get:
      summary: Danh sách lịch đặt bàn
      description: "Cookie HttpOnly mc_member, không cần QR; danh sách/chỉnh sửa chính chủ. Query page>=1 (30 dòng/trang), history=true/false mặc định false, date=YYYY-MM-DD tùy chọn theo giờ VN. Trả {items,total}. DTO Reservation có id/code/tableId/tableName/partySize/startsAt/endsAt/arrivalDeadline/name/phone/note/status/version/tableSessionId/checkedInAt/closedAt/reason. Status CONFIRMED/CHECKED_IN/COMPLETED/CANCELLED/NO_SHOW. Quét no-show khi quá hạn đến 15 phút; scheduler 30 giây. Đóng phiên hoàn tất lịch, không tự đóng khi đủ 60 phút. Cache-Control no-store; mutation CSRF cho member. Socket reservation.changed chỉ staff, không chứa contact."
      responses:
        '200': { description: success/data envelope }
        '401': { description: Cần đăng nhập }
        '403': { description: Không đủ quyền hoặc CSRF bị từ chối }
